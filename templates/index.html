<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../static/style.css">
    <title>Cine-Swipe</title>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <nav>
                <a href="/">
                    <img class="icon" src="../static/icons/home.png"/>
                </a>
                <a href="{{ url_for('about') }}">
                    <img class="icon" src="{{ url_for('static', filename='icons/aboutus.png') }}" alt="About Us"/>
                </a>
            </nav>
        </div>
        <div class="tags-container" id="tagsContainer">
            <div class="tags-rating" id="tagsRating"></div>
            <div class="tags-votes" id="tagsVotes"></div>
            <div class="tags-genres" id="tagsGenres"></div>
        </div>
        <div class="image-container" id="imageContainer">
            <div class="image-inner" id="imageInner"> </div>
        </div>
        <div class="button-container">
            <button class="button-dislike" onclick="getMovie(this)" id="dislike" type="button">NO</button>
            <button class="button-like" onclick="getMovie(this)" id="like" type="button">YES</button>
        </div>
    </div>

<script>
    const ANIM_MS = 280;
    const card = document.querySelector(".image-inner");
    card.addEventListener("click", function (e) {
        card.classList.toggle('is-flipped');
    });

    /** Loaded once; genre names for tags + back of card. */
    const genresPromise = fetch("/api/genres").then(function (r) { return r.json(); });

    /** Next movie JSON (started after each successful render). */
    let nextMoviePromise = null;

    function prefetchNextMovie() {
        nextMoviePromise = fetch("/api/get-next-movie").then(function (r) { return r.json(); });
    }

    var pastMovie = "";

    function genreNamesForMovie(movie, genres) {
        var ids = movie["genre_ids"] || [];
        var names = [];
        for (var i = 0; i < genres.length; i++) {
            if (ids.includes(genres[i]["id"])) {
                names.push(" " + genres[i]["name"]);
            }
        }
        return names;
    }

    async function getMovie(button) {
        if (button != null) {
            if (pastMovie === "") return;

            const cardEl = document.getElementById("imageInner");
            const pastMovieJSON = JSON.parse(pastMovie);
            const votePayload = { movie_id: pastMovieJSON.id, vote: button.id };
            await Promise.all([
                fetch("/api/vote", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(votePayload)
                }).catch(function () {}),
                new Promise(function (resolve) {
                    const isFlipped = cardEl.classList.contains("is-flipped");
                    const flipY = isFlipped ? "rotateY(180deg)" : "";
                    cardEl.style.transition = "transform " + ANIM_MS / 1000 + "s ease, opacity " + ANIM_MS / 1000 + "s ease";
                    cardEl.style.transform = "translateX(" + (button.id === "like" ? 1000 : -1000) + "px) rotate(" + (button.id === "like" ? 45 : -45) + "deg) " + flipY;
                    cardEl.style.opacity = 0;
                    setTimeout(resolve, ANIM_MS);
                })
            ]);

            cardEl.innerHTML = "";
            cardEl.style.cssText = "";
            cardEl.classList.remove("is-flipped");

            document.getElementById("tagsRating").innerHTML = "";
            document.getElementById("tagsVotes").innerHTML = "";
            document.getElementById("tagsGenres").innerHTML = "";
        }

        var movie;
        var genres;
        if (nextMoviePromise) {
            var pair = await Promise.all([nextMoviePromise, genresPromise]);
            movie = pair[0];
            genres = pair[1];
            nextMoviePromise = null;
        } else {
            var pair2 = await Promise.all([
                fetch("/api/get-next-movie").then(function (r) { return r.json(); }),
                genresPromise
            ]);
            movie = pair2[0];
            genres = pair2[1];
        }

        if ("error" in movie) {
            movie = await fetch("/api/get-next-movie").then(function (r) { return r.json(); });
        }
        if ("error" in movie) {
            return;
        }

        const cardContainer = document.getElementById("imageInner");
        const genresString = genreNamesForMovie(movie, genres);

        const frontCont = document.createElement("div");
        frontCont.classList.add("image_face", "image_face--front");

        const backCont = document.createElement("div");
        backCont.classList.add("image_face", "image_face--back");

        const cardHeader = document.createElement("div");
        cardHeader.classList.add("image_header");
        const cardHeader_title = document.createElement("h2");
        cardHeader_title.textContent = movie["title"];
        cardHeader.appendChild(cardHeader_title);
        backCont.appendChild(cardHeader);

        const textContainer = document.createElement("div");
        textContainer.classList.add("image_body");

        const newCard = document.createElement("img");
        newCard.id = "image";
        newCard.className = "image";
        newCard.src = movie["poster_path"];
        pastMovie = JSON.stringify(movie, null, 2);
        //console.log("Storing Movie" + pastMovie);

        frontCont.appendChild(newCard);

        const titleYear = document.createElement("div");
        titleYear.classList.add("title-year-row");

        const title = document.createElement("span");
        title.innerHTML = "Title <br>" + movie["title"];

        const year = document.createElement("span");
        year.innerHTML = "Year <br>" + (movie["release_date"] || "—");

        titleYear.appendChild(title);
        titleYear.appendChild(year);

        frontCont.appendChild(titleYear);

        const textInfo = document.createElement("p");
        textInfo.innerHTML = "Rating: " + movie["vote_average"] + "/10 <br><br> Votes: " + movie["vote_count"] + "<br><br> Genres: " + genresString + "<br><br> Description: " + movie["overview"];
        textContainer.appendChild(textInfo);
        backCont.appendChild(textContainer);

        const tagsRating = document.getElementById("tagsRating");
        const tagsVotes = document.getElementById("tagsVotes");
        const tagsGenres = document.getElementById("tagsGenres");

        const tagRating = document.createElement("p");
        tagRating.innerHTML = "Rating: " + movie["vote_average"] + "/10";
        tagsRating.appendChild(tagRating);

        const tagVotes = document.createElement("p");
        tagVotes.innerHTML = "Votes: " + movie["vote_count"];
        tagsVotes.appendChild(tagVotes);

        const tagGenres = document.createElement("p");
        tagGenres.innerHTML = "Genres: " + genresString;
        tagsGenres.appendChild(tagGenres);

        cardContainer.appendChild(frontCont);
        cardContainer.appendChild(backCont);

        prefetchNextMovie();
    }

    window.onload = getMovie(null);
</script>
</body>
</html>
