<!DOCTYPE html>
<html>
    <div class="container">
        <div class="navbar">
            <nav> <a href="/">
                <img class="icon" src="../static/icons/home.png"/>
            </a> <a href="about.html">About</a></nav>
        <head>
        </div>
            <link rel="stylesheet" href="../static/style.css">
            <title>Cine-Swipe</title>
        </head>
        <body>
            <div class="image-container" id="imageContainer">
                <div class="image-inner" id="imageInner"> </div>
            </div>
            <div class="button-container">
                <button class="button-dislike" onclick="getMovie(this)" id="dislike">NO</button>
                <button  class="button-like" onclick="getMovie(this)" id="like">YES</button>
                
            </div>
        </body>
    </div>
    
</html>

<script>
    const card = document.querySelector(".image-inner");
    card.addEventListener("click", function (e) {
        card.classList.toggle('is-flipped');
    });

    var pastMovie = "";
async function getMovie(button){
    
    
    if (button != null) {
        if (pastMovie === "") return;

        //console.log(typeof pastMovie);
        const card = document.getElementById("imageInner");
        const pastMovieJSON = JSON.parse(pastMovie);
        pastMovieJSON["vote"] = button.id;        
        const response = await Promise.all([
            fetch("api/vote", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pastMovieJSON)
            }),
            new Promise(r => {
                const isFlipped = card.classList.contains('is-flipped');
                const flipY = isFlipped ? "rotateY(180deg)" : "";

                card.style.transition = "transform 0.4s ease, opacity 0.4s ease";
                card.style.transform = `translateX(${button.id === "like" ? 1000 : -1000}px) rotate(${button.id === "like" ? 45 : -45}deg) ${flipY}`;
                card.style.opacity = 0;
                setTimeout(r, 400);
            })
        ]);
        
        card.innerHTML = "";
        card.style.cssText = "";
        card.classList.remove('is-flipped');

    }

    const [_, response] = await Promise.all([
        new Promise(r => setTimeout(r, 400)),
        fetch("/api/get-next-movie")
    ]);
    const movie = await response.json();

    if(!("error" in movie)){
        const cardContainer = document.getElementById("imageInner");

        const frontCont = document.createElement('div');
        frontCont.classList.add('image_face', 'image_face--front');

        const imageContent = document.createElement('div');
        imageContent.classList.add('image_content');

        const backCont = document.createElement('div');
        backCont.classList.add('image_face', 'image_face--back');

        // creating card header
        const cardHeader = document.createElement('div');
        cardHeader.classList.add('image_header')
        const cardHeader_title = document.createElement("h2");
        cardHeader_title.textContent = movie["title"];
        cardHeader.appendChild(cardHeader_title);
        backCont.appendChild(cardHeader); 

        frontCont.innerHTML = "";
        const textContainer = document.createElement('div');
        textContainer.classList.add('image_body');
        textContainer.innerHTML = "";

        // creates poster image
        const newCard = document.createElement("img");
        newCard.id = "image";
        newCard.className = "image";
        newCard.src = movie["poster_path"];
        pastMovie = JSON.stringify(movie, null, 2);
        console.log("Storing Movie" + pastMovie);
        frontCont.appendChild(newCard);
        
        // check the genre of the movie
        genresString = [];
        movieGenre = movie["genre_ids"];
        console.log(movieGenre);
        const genres = await fetch("/api/genres").then(function (response) { return response.json(); });
        console.log(genres);
        for (const genre of genres){
            console.log("genre: " + genre["id"]);
            if (movieGenre.includes(genre["id"])){
                genresString.push(" " + genre["name"]);
            }
        }

        // creates text info
        const textInfo = document.createElement("p");
        textInfo.innerHTML = "Rating: " + movie["vote_average"] + "/10 <br><br> Votes: " + movie["vote_count"] + "<br><br> Genres: " + genresString + "<br><br> Description: " + movie["overview"];
        textContainer.appendChild(textInfo);
        backCont.appendChild(textContainer); 
 
        cardContainer.appendChild(frontCont);  
        cardContainer.appendChild(backCont);   

    }
}

window.onload = getMovie(null);
</script>
