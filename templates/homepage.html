<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Cine-Swipe</title>
    <style>
        .session-panel {
            width: min(420px, 90vw);
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            text-align: center;
        }
        .session-panel h2 {
            margin: 0 0 0.35rem;
            font-size: 1.15rem;
        }
        .session-hint {
            margin: 0 0 1rem;
            font-size: 0.85rem;
            color: #333;
        }
        #createHost {
            display: block;
            width: 100%;
            padding: 0.65rem 1rem;
            margin: 0 0 0.5rem;
            font: inherit;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #333;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-session {
            display: block;
            width: 100%;
            padding: 0.65rem 1rem;
            margin: 0;
            font: inherit;
            border-radius: 8px;
            background: #e8e4dc;
            color: #222;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
        }
        .host-err {
            color: #c62828;
            margin: 0.5rem 0 0;
            font-size: 0.9rem;
        }
        .genre-field {
            margin: 0.75rem 0;
            text-align: left;
        }
        .genre-field label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        #genreSelect {
            width: 100%;
            max-width: 100%;
            min-height: 10rem;
            padding: 0.35rem;
            font: inherit;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        #langSelect {
            width: 100%;
            max-width: 100%;
            min-height: 10rem;
            padding: 0.35rem;
            font: inherit;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .genre-hint {
            font-size: 0.75rem;
            color: #555;
            margin: 0.35rem 0 0;
        }
        .genre-hint kbd {
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <nav>
                <a href="{{ url_for('home') }}">
                    <img class="icon" src="{{ url_for('static', filename='icons/home.png') }}" alt="Home"/>
                </a>
                <a href="{{url_for('about')}}">
                    <img class="icon" src="{{url_for('static', filename='icons/aboutus.png')}}" alt="About Us"/>
                </a>
            </nav>
        </div>
        <div>
        <h1 id="homepage-title">CINE-SWIPE</h1>
        <div class="homescreen">
            <div>
            <section class="session-panel" aria-label="Group session">
                <h2>Play with friends</h2>
                <p class="session-hint">Host opens a room; everyone else joins with a code or link.</p>
                <button type="button" id="createHost">Host a session</button>
                <a class="btn-session" href="{{ url_for('join_page') }}">Join with a code</a>
                <p id="hostErr" class="host-err" hidden></p>
                <button class="btn-secondary" onclick="document.getElementById('formDialog').showModal()">More Options</button>

            </section>
            </div>
            <dialog id="formDialog">
                <form id="prefsForm">
                    <button type="button" onclick="document.getElementById('formDialog').close()">X Close</button>

                    <label for="isAdult">Adult?</label>
                    <input type="checkbox" id="isAdult" name="isAdult" value="yes">

                    <div class="genre-field">
                        <label for="genreSelect">Genres</label>
                        <select id="genreSelect" name="genres" multiple size="10" aria-describedby="genreHint"></select>
                        <p id="genreHint" class="genre-hint">Hold <kbd>Ctrl</kbd> (Windows) or <kbd>⌘</kbd> (Mac) and click to select more than one.</p>
                    </div>

                    <div class="lang-field"> 
                        <label for="langSelect">Languages</label>
                        <select id="langSelect" name="languages" multiple size="10" aria-describedby="languageHint"></select>
                        <p id="genreHint" class="genre-hint">Hold <kbd>Ctrl</kbd> (Windows) or <kbd>⌘</kbd> (Mac) and click to select more than one.</p>                        
                    </div>

                    <label for="start">Date Released from:</label>
                    <input type="date" id="start" name="startDate"
                        value="2025-01-01"
                        min="2025-01-01" max="2025-12-31">

                    <label for="end">To:</label>
                    <input type="date" id="end" name="endDate"
                        value="2025-01-01"
                        min="2025-01-01" max="2025-12-31">

                    <label for="rating">Rating (1.0 to 10.0):</label>
                    <input type="range" id="rating" name="rating" min="1.0" max="10.0" step="0.1">
                    <output id="ratingValue">5.0</output>


                    <input type="submit" value="Submit" >
                </form>
            </dialog>
        </div>
        </div>

        <!-- <button type="button" onclick="start()">Start</button> -->
    </div>

<script>
    function start() {
        window.location.href = "/start";
    }

    function select(id) {
        var opt = document.getElementById(id);
        if (opt) opt.select = !opt.select;
    }

    async function populateGenres() {
        const genres = await fetch("/api/genres").then(function (r) { return r.json(); });
        const sel = document.getElementById("genreSelect");
        if (!sel) return;
        sel.innerHTML = "";
        genres.forEach(function (genre) {
            const opt = document.createElement("option");
            opt.value = String(genre.id);
            opt.textContent = genre.name;
            sel.appendChild(opt);
        });
    }

    async function populateLang() {
        const langs = await fetch("/api/languages").then(function (r) { return r.json(); });
        const langList = document.getElementById("langSelect");
        if (!langList) return;
        langs.forEach(function (row, idx) {
            const input = document.createElement("option");
            input.value = "lang-" + (row.iso_639_1 || row.code || "i" + idx);
            input.textContent = row.english_name || row.name || "";
            langList.appendChild(input);
        });
    }

    window.onload = function () {
        populateGenres();
        populateLang();
    };

    document.getElementById("prefsForm").addEventListener("submit", function (e) {
        e.preventDefault();
    });

    document.addEventListener("DOMContentLoaded", function () {
        const rangeInput = document.getElementById("rating");
        const valueDisplay = document.getElementById("ratingValue");
        if (rangeInput && valueDisplay) {
            rangeInput.addEventListener("input", function () {
                valueDisplay.textContent = this.value;
            });
        }
    });

    document.getElementById("createHost").addEventListener("click", async function () {
        const err = document.getElementById("hostErr");
        err.hidden = true;
        const includeAdult = document.getElementById("isAdult").checked;
        const genreIds = [];
        const sel = document.getElementById("genreSelect");
        if (sel) {
            for (let i = 0; i < sel.selectedOptions.length; i++) {
                const id = parseInt(sel.selectedOptions[i].value, 10);
                if (!isNaN(id)) genreIds.push(id);
            }
        }
        try {
            const r = await fetch("{{ url_for('api_create_room') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    include_adult: includeAdult,
                    genre_ids: genreIds
                })
            });
            if (!r.ok) throw new Error("Could not create room");
            const d = await r.json();
            window.location.href = d.room_url;
        } catch (e) {
            err.textContent = "Could not create a session. Try again.";
            err.hidden = false;
        }
    });
</script>
</body>
</html>
