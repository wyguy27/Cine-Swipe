<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Cine-Swipe</title>
    <style>
        .session-panel {
            width: min(420px, 90vw);
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            text-align: center;
        }
        .session-panel h2 {
            margin: 0 0 0.35rem;
            font-size: 1.15rem;
        }
        .session-hint {
            margin: 0 0 1rem;
            font-size: 0.85rem;
            color: #333;
        }
        #createHost {
            display: block;
            width: 100%;
            padding: 0.65rem 1rem;
            margin: 0 0 0.5rem;
            font: inherit;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #333;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-session {
            display: block;
            width: 100%;
            padding: 0.65rem 1rem;
            margin: 0;
            font: inherit;
            border-radius: 8px;
            background: #e8e4dc;
            color: #222;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
        }
        .host-err {
            color: #c62828;
            margin: 0.5rem 0 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <nav>
                <a href="{{ url_for('home') }}">
                    <img class="icon" src="{{ url_for('static', filename='icons/home.png') }}" alt="Home"/>
                </a>
                <a href="{{url_for('about')}}">
                    <img class="icon" src="{{url_for('static', filename='icons/aboutus.png')}}" alt="About Us"/>
                </a>
            </nav>
        </div>
        <div>
        <h1 id="homepage-title">CINE-SWIPE</h1>
        <div class="homescreen">
            <div>
            <section class="session-panel" aria-label="Group session">
                <h2>Play with friends</h2>
                <p class="session-hint">Host opens a room; everyone else joins with a code or link.</p>
                <button type="button" id="createHost">Host a session</button>
                <a class="btn-session" href="{{ url_for('join_page') }}">Join with a code</a>
                <p id="hostErr" class="host-err" hidden></p>
                <button class="btn-secondary" onclick="document.getElementById('formDialog').showModal()">More Options</button>

            </section>
            </div>
            <dialog id="formDialog">
                <form id="prefsForm">
                    <button type="button" onclick="document.getElementById('formDialog').close()">X Close</button>

                    <label for="isAdult">Adult?</label>
                    <input type="checkbox" id="isAdult" name="isAdult" value="yes">
                    
                    <div id="genres">Genres: </div>

                    <div id="lang">Languages: </div>

                    <label for="start">Date Released from:</label>
                    <input type="date" id="start" name="startDate"
                        value="2025-01-01"
                        min="2025-01-01" max="2025-12-31">

                    <label for="end">To:</label>
                    <input type="date" id="end" name="endDate"
                        value="2025-01-01"
                        min="2025-01-01" max="2025-12-31">

                    <label for="rating">Rating (1.0 to 10.0):</label>
                    <input type="range" id="rating" name="rating" min="1.0" max="10.0" step="0.1">
                    <output id="ratingValue">5.0</output>


                    <input type="submit" value="Submit" >
                </form>
            </dialog>
        </div>
        </div>

        <!-- <button type="button" onclick="start()">Start</button> -->
    </div>

<script>
    window.onload = () =>{
        populateGenres();
        // populateLang(); //still need function to populate languages
    }

    function start(){
        window.location.href = "/start";
    }

    function select(id){
        var opt = document.getElementById(id);
        opt.select= !opt.select;
    }

    async function populateGenres(){
        const genres = await fetch('/api/genres').then(response => response.json());
        console.log(genres);
        const genreList = document.getElementById('genres')
        genres.forEach(genre => {
            const input = document.createElement('input');
            input.type = "checkbox";
            input.id = genre.id;
            input.value = genre.name;
            

            const label = document.createElement('label');
            label.htmlFor = input.id;
            label.textContent = genre.name;

            genreList.appendChild(input);
            genreList.appendChild(label);
        });
    }

    async function populateLang(){
        const lang = await fetch('/api/languages').then(response => response.json());
        console.log(lang);
        const langList = document.getElementById('lang')
        genres.forEach(genre => {
            const input = document.createElement('input');
            input.type = "checkbox";
            input.id = lang.id;
            input.value = lang.name;
            

            const label = document.createElement('label');
            label.htmlFor = input.id;
            label.textContent = lang.name;

            const container = document.createElement('div');

            container.appendChild(input);
            container.appendChild(label);

            langList.appendChild(container);
        });
    }

    // Get the elements
    const rangeInput = document.getElementById("rating");
    const valueDisplay = document.getElementById("ratingValue");

    // Add an event listener to update the display as the slider moves
    rangeInput.addEventListener("input", function() {
        valueDisplay.textContent = this.value;
    });

    function showForm(){
        var form = document.getElementById('prefsForm');

        if(form.style.display === "flex"){
            form.style.display = "none";
        }
        else {
            form.style.display = "flex";
        }
    }

</script>
    <script>
        document.getElementById("createHost").addEventListener("click", async function () {
            const err = document.getElementById("hostErr");
            err.hidden = true;
            const includeAdult = document.getElementById("isAdult").checked;
            const genreIds = [];
            document.querySelectorAll("#genres input[type=\"checkbox\"]:checked").forEach(function (cb) {
                const id = parseInt(cb.id, 10);
                if (!isNaN(id)) genreIds.push(id);
            });
            try {
                const r = await fetch("{{ url_for('api_create_room') }}", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        include_adult: includeAdult,
                        genre_ids: genreIds
                    })
                });
                if (!r.ok) throw new Error("Could not create room");
                const d = await r.json();
                window.location.href = d.room_url;
            } catch (e) {
                err.textContent = "Could not create a session. Try again.";
                err.hidden = false;
            }
        });
    </script>
    <script>
        document.getElementById("prefsForm").addEventListener("submit", function (e) {
            e.preventDefault();
        });

        window.onload = function () {
            populateGenres();
        };

        function start() {
            window.location.href = "/start";
        }

        function select(id) {
            var opt = document.getElementById(id);
            opt.select = !opt.select;
        }

        async function populateGenres() {
            const genres = await fetch("/api/genres").then(function (response) { return response.json(); });
            console.log(genres);
            const genreList = document.getElementById("genres");
            genres.forEach(function (genre) {
                const input = document.createElement("input");
                input.type = "checkbox";
                input.id = String(genre.id);
                input.value = genre.name;

                const label = document.createElement("label");
                label.htmlFor = input.id;
                label.textContent = genre.name;

                genreList.appendChild(input);
                genreList.appendChild(label);
            });
        }
    </script>
</body>
</html>
