<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Join a room — Cine-Swipe</title>
    <style>
        .join-card {
            background: rgba(255,255,255,0.92);
            padding: 2rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            max-width: 380px;
            text-align: center;
        }
        .join-card h1 { margin-top: 0; font-size: 1.4rem; }
        .join-card input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            font-size: 1.5rem;
            letter-spacing: 0.15em;
            text-align: center;
            text-transform: uppercase;
            padding: 0.75rem;
            margin: 1rem 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        .join-card button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: #333;
            color: #fff;
            font: inherit;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .err { color: #c62828; margin-top: 0.5rem; font-size: 0.9rem; }
        .join-card a.home-link { display: inline-block; margin-top: 1rem; color: #333; }
    </style>
</head>
<body>
    <div class="container" style="justify-content: center;">
        <div class="join-card"  style="margin-top : 25vh">
            <h1>Join a session</h1>
            <p>Enter the room code from your host.</p>
            {% if error == 'invalid' %}
            <p class="err">That code isn’t valid. Check with the host and try again.</p>
            {% elif error == 'full' %}
            <p class="err">This room is full. Ask the host to create a new room or try again later.</p>
            {% endif %}
            <form method="post" action="{{ url_for('join_room_submit') }}">
                <input type="text" name="code" id="code" maxlength="12" autocomplete="off"
                       placeholder="CODE" value="{{ prefilled_code or '' }}" required
                       aria-label="Room code">
                <button type="submit">Join</button>
            </form>
            <a class="home-link" href="{{ url_for('home') }}">← Back home</a>
        </div>
    </div>
</body>
</html>
